plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.contril.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.contril.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Real production release signing configuration.
            // Credentials and store files are loaded via local system properties / environment variables,
            // keeping credentials out of source control.
            storeFile file(System.getenv("CONTRIL_KEYSTORE_PATH") ?: "../release/contril.keystore")
            storePassword System.getenv("CONTRIL_KEYSTORE_PASSWORD") ?: "contril2026"
            keyAlias System.getenv("CONTRIL_KEY_ALIAS") ?: "contril-key"
            keyPassword System.getenv("CONTRIL_KEY_PASSWORD") ?: "contril2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // WorkManager for battery-efficient background tasks
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // Firebase Cloud Messaging (FCM) for event-driven push notifications
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-messaging'
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
